<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const UN={Conductivity:['µS/cm','mS/cm'],Temperature:['°C','°F'],pH:['pH (dimensionless)'],Hardness:['mg/L as CaCO₃','ppm','gpg']},KW={Conductivity:/cond/i,Temperature:/temp/i,pH:/ph/i,Hardness:/hard/i},HF={'mg/L as CaCO₃':1,ppm:1,gpg:17.1181};

// demo data
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}

 st.exps.push(mk({name:'Lab Bench Temperature',desc:'Bench temperature logged in °F, standardized to °C.',obj:'Track temperature during runs.',param:'Temperature',date:'2026-11-02',sample:'BENCH-1',lab:'UTEP Water Lab',notes:'',file:'temp.csv',uo:'°F',us:'°C',lo:18,hi:26,rows:b(gen(5,70,'temperature_F',1))}))}

  if(seen[r.t]!=null)add('Duplicate record',i,'low',`Timestamp already recorded in row ${seen[r.t]+1}.`,'Remove the duplicate or confirm it is a repeat measurement.');else seen[r.t]=i});

function fc(e,h){const p=[];e.rows.forEach((r,i)=>{const v=sv(e,r);if(v!=null&&Number.isFinite(r.ms))p.push({i,x:r.ms/36e5,y:v})});
